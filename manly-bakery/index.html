<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manly Bakery Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF8;
  --surface:#FFFFFF;
  --ink:#17140F;
  --muted:#8B8175;
  --line:#E7E1D8;
  --accent:#C0402A;
  --accent-ink:#FFFFFF;
  --on-photo:#FFFFFF;
  --photo-scrim:linear-gradient(to top,rgba(18,13,6,.74) 0%,rgba(18,13,6,.34) 46%,rgba(18,13,6,0) 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121110;
    --surface:#1C1A17;
    --ink:#F4F0E9;
    --muted:#968D80;
    --line:#2B2723;
    --accent:#E05B3D;
    --accent-ink:#17140F;
  }
}
:root[data-theme="dark"]{
  --ground:#121110;
  --surface:#1C1A17;
  --ink:#F4F0E9;
  --muted:#968D80;
  --line:#2B2723;
  --accent:#E05B3D;
  --accent-ink:#17140F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font:400 15px/1.45 Archivo,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
button{font:inherit;color:inherit;margin:0;border:0;background:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}

/* ---------- header ---------- */
.head{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--ground);border-bottom:1px solid var(--line);
}
.head .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.mark{
  font-family:Anton,Impact,"Arial Narrow",sans-serif;
  font-size:17px;letter-spacing:.13em;text-transform:uppercase;line-height:1;
  padding:6px 0;
}
.back{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.04em;padding:8px 0}
.back:hover{color:var(--ink)}

/* ---------- start ---------- */
.start{padding-block:22vh 40px;text-align:center}
@media(max-height:620px){.start{padding-block:14vh 32px}}
.cta{
  display:block;width:100%;
  background:var(--ink);color:var(--ground);
  font-family:Anton,Impact,"Arial Narrow",sans-serif;
  font-size:clamp(26px,7.4vw,40px);letter-spacing:.055em;text-transform:uppercase;
  padding:26px 18px;border-radius:2px;
  transition:transform .14s ease,opacity .14s ease;
}
.cta:hover{opacity:.86}
.cta:active{transform:scale(.985)}
.fine{margin:18px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.055em;text-transform:uppercase}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:30;
  background:var(--ground);border-bottom:1px solid var(--line);
}
.tabs .wrap{display:flex;gap:26px}
.tab{
  font-family:Anton,Impact,"Arial Narrow",sans-serif;
  font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:15px 0;position:relative;
}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink)
}

/* ---------- grid ---------- */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:2px;
  padding-block:2px 128px;
}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:840px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;background:#E5DCCD;overflow:hidden}
.add{
  display:block;width:100%;height:100%;padding:0;position:relative;
  transition:transform .2s cubic-bezier(.2,.7,.3,1);
}
.tile:hover .add{transform:scale(1.035)}
.add img{display:block;width:100%;height:100%;object-fit:cover}
.cap{
  position:absolute;inset:auto 0 0 0;padding:26px 10px 9px;
  background:var(--photo-scrim);color:var(--on-photo);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;text-align:left;
}
.cap b{font-weight:600;font-size:12.5px;letter-spacing:.012em;line-height:1.2}
.cap span{font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.92;flex:none}
.tile.on .add::after{content:"";position:absolute;inset:0;background:rgba(18,13,6,.3)}
.qty{
  position:absolute;top:8px;right:8px;z-index:2;
  min-width:30px;height:30px;padding:0 7px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
  display:grid;place-items:center;
  animation:pop .2s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.dec{
  position:absolute;top:8px;left:8px;z-index:2;
  width:30px;height:30px;border-radius:999px;
  background:rgba(255,255,255,.93);color:#17140F;
  font-size:19px;font-weight:600;line-height:28px;
}

/* ---------- cart bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));
  pointer-events:none;
}
.bar .wrap{padding-inline:0;pointer-events:auto}
.bar button{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;
  background:var(--accent);color:var(--accent-ink);
  padding:19px 22px;border-radius:2px;
  font-family:Anton,Impact,"Arial Narrow",sans-serif;
  font-size:17px;letter-spacing:.075em;text-transform:uppercase;
  box-shadow:0 8px 28px rgba(18,13,6,.22);
  animation:rise .2s ease;
}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bar b{font-variant-numeric:tabular-nums;font-weight:400}

/* ---------- checkout ---------- */
.sheet{padding-block:26px 140px;max-width:560px;margin:0 auto}
.lines{list-style:none;margin:0 0 4px;padding:0}
.lines li{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.lines .nm{flex:1;font-weight:500;font-size:15px}
.lines .amt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:58px;text-align:right}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{
  width:32px;height:32px;border:1px solid var(--line);border-radius:999px;
  font-size:17px;line-height:1;color:var(--ink);display:grid;place-items:center;
}
.step button:hover{border-color:var(--ink)}
.step b{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px}
.total span{font-family:Anton,Impact,sans-serif;font-size:15px;letter-spacing:.11em;text-transform:uppercase}
.total b{font-family:Anton,Impact,sans-serif;font-size:27px;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-weight:400}
.fields{display:grid;gap:9px;margin-top:22px}
.fields input{
  width:100%;padding:16px 15px;border:1px solid var(--line);border-radius:2px;
  background:var(--surface);color:var(--ink);font:400 16px Archivo,sans-serif;
}
.fields input::placeholder{color:var(--muted)}
.fields input:focus{border-color:var(--ink);outline:none}

/* ---------- done ---------- */
.done{padding-block:16vh 40px;text-align:center;max-width:460px;margin:0 auto}
.num{font-family:Anton,Impact,sans-serif;font-size:clamp(58px,17vw,86px);letter-spacing:.01em;line-height:1;font-variant-numeric:tabular-nums}
.done p{margin:16px 0 0;font-size:16px;color:var(--muted)}
.done .again{margin-top:34px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="head">
  <div class="wrap">
    <button class="mark" id="home">Manly Bakery</button>
    <button class="back" id="back" hidden>&larr; Menu</button>
  </div>
</header>

<main>
  <section class="view wrap" id="v-start">
    <div class="start">
      <button class="cta" id="begin">Start your order</button>
      <p class="fine">Pickup &middot; ready in 10 min</p>
    </div>
  </section>

  <section class="view" id="v-menu" hidden>
    <div class="tabs">
      <div class="wrap" role="tablist" aria-label="Menu">
        <button class="tab" role="tab" id="t-hot" aria-selected="true" aria-controls="grid">Hot Food</button>
        <button class="tab" role="tab" id="t-pastry" aria-selected="false" aria-controls="grid">Pastry</button>
      </div>
    </div>
    <div class="wrap"><div class="grid" id="grid" role="tabpanel" aria-labelledby="t-hot"></div></div>
  </section>

  <section class="view wrap" id="v-checkout" hidden>
    <div class="sheet">
      <ul class="lines" id="lines"></ul>
      <div class="total"><span>Total</span><b id="total">$0.00</b></div>
      <div class="fields">
        <input id="f-name" type="text" placeholder="Name" autocomplete="given-name" enterkeyhint="next">
        <input id="f-phone" type="tel" placeholder="Mobile" autocomplete="tel" enterkeyhint="done">
      </div>
    </div>
  </section>

  <section class="view wrap" id="v-done" hidden>
    <div class="done">
      <div class="num" id="orderno">#000</div>
      <p>Ready in about 10 minutes.<br>Pay when you collect.</p>
      <button class="again" id="again">New order</button>
    </div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <button id="barbtn"><span id="barlabel">Checkout</span><b id="barsum"></b></button>
  </div>
</div>
<p aria-live="polite" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" id="live"></p>

<script>
/* ------------------------------------------------------------------
   MENU. To use real photos, add img:'<url or data URI>' to an item —
   it replaces the drawn placeholder. Order here doesn't matter; the
   page alphabetises each tab on load.
------------------------------------------------------------------ */
var MENU = {
  hot: [
    {n:'Bacon & Egg Roll',        p:9.50, d:'bunRoll'},
    {n:'Beef Pie',                p:7.50, d:'pie',     o:{lid:'#E4B571'}},
    {n:'Chicken & Mushroom Pie',  p:8.00, d:'pie',     o:{lid:'#EFCF9A'}},
    {n:'Ham & Cheese Croissant',  p:8.50, d:'croissant',o:{top:'cheese'}},
    {n:'Pizza Scroll',            p:6.00, d:'scroll',  o:{spiral:'#B8402C',cheese:true}},
    {n:'Potato Pie',              p:8.50, d:'pie',     o:{mash:true}},
    {n:'Sausage Roll',            p:6.50, d:'roll',    o:{fill:'#A9553C'}},
    {n:'Spinach & Ricotta Roll',  p:7.00, d:'roll',    o:{fill:'#6E8C4A'}},
    {n:'Steak & Mushroom Pie',    p:8.50, d:'pie',     o:{lid:'#CE9A55'}},
    {n:'Vegetable Pastie',        p:7.00, d:'pastie'}
  ],
  pastry: [
    {n:'Almond Croissant',        p:7.50, d:'croissant',o:{top:'almond'}},
    {n:'Apple Turnover',          p:6.00, d:'turnover'},
    {n:'Cinnamon Scroll',         p:6.50, d:'scroll',  o:{spiral:'#7A4A28',icing:true}},
    {n:'Custard Tart',            p:6.00, d:'tart',    o:{top:'#F2CB5C',nutmeg:true}},
    {n:'Finger Bun',              p:5.00, d:'fingerBun'},
    {n:'Lamington',               p:5.50, d:'lamington'},
    {n:'Neenish Tart',            p:5.50, d:'tart',    o:{neenish:true}},
    {n:'Pain au Chocolat',        p:6.50, d:'painChoc'},
    {n:'Plain Croissant',         p:6.00, d:'croissant',o:{}},
    {n:'Vanilla Slice',           p:6.50, d:'slice'}
  ]
};

var P = {
  crust:'#D9A45C', crustDeep:'#B0752F', crustLight:'#EFC98C', crustPale:'#F5DDB2',
  bread:'#E6C48F', breadDeep:'#C99A5E',
  choc:'#452919', chocMid:'#6E4327',
  cream:'#F7EBD2', custard:'#F2CB5C',
  pink:'#E79BB0', white:'#FBF5EA', coconut:'#EFE5D2',
  green:'#6E8C4A', red:'#B8402C', cheese:'#E8B84B', potato:'#F1DFB6'
};
var TONES = ['#E9E1D4','#E2D8C8','#EEE7DA','#DED4C3'];

/* ---------- canvas helpers ---------- */
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);c.fill();}
function rr(c,x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();}
function poly(c,pts,r,fill){c.fillStyle=fill;c.beginPath();
  for(var i=0;i<pts.length;i++){var a=pts[(i-1+pts.length)%pts.length],b=pts[i],d=pts[(i+1)%pts.length];
    c.arcTo(b[0],b[1],d[0],d[1],r);}
  c.closePath();c.fill();}
function rng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function under(c,x,y,rx,ry){var g=c.createRadialGradient(x,y,4,x,y,rx);
  g.addColorStop(0,'rgba(74,53,28,.30)');g.addColorStop(1,'rgba(74,53,28,0)');
  c.fillStyle=g;ell(c,x,y,rx,ry);}
function gloss(c,x,y,rx,ry,rot){c.fillStyle='rgba(255,255,255,.2)';ell(c,x,y,rx,ry,rot);}

var DRAW = {};

DRAW.pie=function(c,o){
  var cx=200,cy=208,r=126;
  under(c,cx,cy+104,138,30);
  c.fillStyle=P.crustDeep;c.beginPath();
  for(var i=0;i<=240;i++){var a=i/240*Math.PI*2,rad=r+11*Math.abs(Math.sin(a*11));
    var x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad*.9;i?c.lineTo(x,y):c.moveTo(x,y);}
  c.closePath();c.fill();
  c.fillStyle=P.crust;ell(c,cx,cy,r,r*.9);
  if(o.mash){
    c.fillStyle=P.potato;ell(c,cx,cy-6,r-26,(r-26)*.88);
    c.strokeStyle='rgba(197,160,96,.75)';c.lineWidth=7;c.lineCap='round';c.beginPath();
    for(var j=0;j<=170;j++){var b=j/170*Math.PI*5,rd=8+b*6.4;
      var mx=cx+Math.cos(b)*rd,my=cy-6+Math.sin(b)*rd*.86;j?c.lineTo(mx,my):c.moveTo(mx,my);}
    c.stroke();
  }else{
    c.fillStyle=o.lid||P.crustLight;ell(c,cx,cy-7,r-28,(r-28)*.88);
    c.strokeStyle='rgba(150,98,40,.55)';c.lineWidth=7;c.lineCap='round';
    for(var v=0;v<2;v++){var vy=cy-18+v*28;c.beginPath();c.moveTo(cx-20,vy);c.lineTo(cx+20,vy);c.stroke();}
  }
  gloss(c,cx-42,cy-50,46,24,-.3);
};

DRAW.roll=function(c,o){
  under(c,200,300,140,26);
  rr(c,54,148,292,144,58,P.crust);
  rr(c,72,162,254,54,27,P.crustLight);
  c.strokeStyle='rgba(150,98,40,.6)';c.lineWidth=9;c.lineCap='round';
  for(var i=0;i<3;i++){var x=126+i*74;c.beginPath();c.moveTo(x-18,180);c.lineTo(x+16,244);c.stroke();}
  c.fillStyle=P.crustDeep;ell(c,338,220,17,60);
  c.fillStyle=o.fill;ell(c,340,220,10,44);
  gloss(c,150,180,70,17,-.05);
};

DRAW.bunRoll=function(c){
  under(c,200,306,132,26);
  rr(c,64,232,272,72,32,P.breadDeep);
  rr(c,72,198,256,44,16,'#A9553C');
  c.fillStyle=P.white;ell(c,168,206,50,24);
  c.fillStyle=P.custard;ell(c,168,205,25,17);
  c.fillStyle=P.bread;c.beginPath();c.ellipse(200,200,136,86,0,Math.PI,0);c.fill();
  rr(c,64,186,272,18,9,P.bread);
  gloss(c,158,150,64,22,-.12);
};

DRAW.croissant=function(c,o){
  under(c,200,292,142,26);
  var CX=200,CY=92,R=158,A0=Math.PI*0.175,A1=Math.PI*0.825,N=64,MW=50;
  function pt(t){var a=A0+(A1-A0)*t;return{x:CX+Math.cos(a)*R,y:CY+Math.sin(a)*R,a:a};}
  function wd(t){return Math.pow(Math.sin(Math.PI*t),0.58)*MW+4;}
  function shape(pad){
    c.beginPath();
    for(var i=0;i<=N;i++){var t=i/N,p=pt(t),w=wd(t)+pad;
      c.lineTo(p.x+Math.cos(p.a)*w,p.y+Math.sin(p.a)*w);}
    for(var j=N;j>=0;j--){var u=j/N,q=pt(u),v=wd(u)+pad;
      c.lineTo(q.x-Math.cos(q.a)*v,q.y-Math.sin(q.a)*v);}
    c.closePath();
  }
  c.fillStyle=P.crustDeep;shape(6);c.fill();
  c.fillStyle=P.crust;shape(0);c.fill();
  c.save();shape(-1);c.clip();
  c.fillStyle=P.crustLight;
  c.beginPath();
  for(var m=0;m<=N;m++){var t2=m/N,p2=pt(t2),w2=wd(t2);
    c.lineTo(p2.x-Math.cos(p2.a)*w2*0.92,p2.y-Math.sin(p2.a)*w2*0.92);}
  for(var n=N;n>=0;n--){var t3=n/N,p3=pt(t3),w3=wd(t3);
    c.lineTo(p3.x-Math.cos(p3.a)*w3*0.16,p3.y-Math.sin(p3.a)*w3*0.16);}
  c.closePath();c.fill();
  c.strokeStyle='rgba(150,98,40,.52)';c.lineWidth=8;c.lineCap='round';
  for(var k=1;k<=4;k++){var t4=k/5,p4=pt(t4),w4=wd(t4)+16;
    c.beginPath();
    c.moveTo(p4.x+Math.cos(p4.a)*w4,p4.y+Math.sin(p4.a)*w4);
    c.lineTo(p4.x-Math.cos(p4.a)*w4,p4.y-Math.sin(p4.a)*w4);
    c.stroke();}
  var r1=rng(o.top==='almond'?7:21);
  if(o.top==='almond'||o.top==='cheese'){
    for(var z=0;z<(o.top==='almond'?30:18);z++){
      var tt=0.14+r1()*0.72,pp=pt(tt),off=(r1()-0.5)*wd(tt)*1.5;
      var px=pp.x+Math.cos(pp.a)*off,py=pp.y+Math.sin(pp.a)*off;
      if(o.top==='almond'){
        c.fillStyle='rgba(255,252,244,.94)';
        c.save();c.translate(px,py);c.rotate(r1()*3.1);
        c.beginPath();c.ellipse(0,0,13,4.6,0,0,6.3);c.fill();c.restore();
      }else{
        c.fillStyle='rgba(224,168,54,.86)';ell(c,px,py,11+r1()*7,7+r1()*4);
      }
    }
  }
  c.restore();
};

DRAW.scroll=function(c,o){
  under(c,200,300,126,26);
  c.fillStyle=P.crustDeep;ell(c,200,208,134,122);
  c.fillStyle=P.crust;ell(c,200,204,126,114);
  c.fillStyle=P.crustLight;ell(c,200,200,116,104);
  c.strokeStyle=o.spiral;c.lineWidth=19;c.lineCap='round';c.lineJoin='round';c.beginPath();
  for(var i=0;i<=280;i++){var a=i/280*Math.PI*4.1,r=9+a*8.2;
    var x=200+Math.cos(a)*r,y=200+Math.sin(a)*r*.9;i?c.lineTo(x,y):c.moveTo(x,y);}
  c.stroke();
  if(o.cheese){c.fillStyle='rgba(232,184,75,.8)';var r3=rng(3);
    for(var j=0;j<20;j++){var a2=r3()*6.3,rd=r3()*104;ell(c,200+Math.cos(a2)*rd,200+Math.sin(a2)*rd*.9,10,7);}}
  if(o.icing){c.strokeStyle='rgba(255,253,247,.94)';c.lineWidth=9;c.beginPath();
    for(var k=0;k<=60;k++){var t=k/60,x2=92+t*216,y2=170+Math.sin(t*9)*30;k?c.lineTo(x2,y2):c.moveTo(x2,y2);}
    c.stroke();}
};

DRAW.turnover=function(c){
  under(c,200,296,132,26);
  poly(c,[[200,102],[332,288],[68,288]],26,P.crustDeep);
  poly(c,[[200,116],[320,280],[80,280]],22,P.crust);
  poly(c,[[200,142],[296,266],[104,266]],18,P.crustLight);
  c.strokeStyle='rgba(150,98,40,.6)';c.lineWidth=7;c.lineCap='round';
  for(var i=0;i<2;i++){c.beginPath();c.moveTo(178+i*26,192);c.lineTo(170+i*26,226);c.stroke();}
  c.strokeStyle='rgba(150,98,40,.45)';c.lineWidth=5;

/* ---------- build tiles ---------- */
function photo(item,idx){
  if(item.img)return item.img;
  var cv=document.createElement('canvas');cv.width=cv.height=400;
  var c=cv.getContext('2d');
  c.fillStyle=TONES[idx%TONES.length];c.fillRect(0,0,400,400);
  var g=c.createRadialGradient(200,150,40,200,200,290);
  g.addColorStop(0,'rgba(255,255,255,.34)');g.addColorStop(1,'rgba(120,98,66,.14)');
  c.fillStyle=g;c.fillRect(0,0,400,400);
  (DRAW[item.d]||DRAW.pie)(c,item.o||{});
  return cv.toDataURL('image/jpeg',0.86);
}

var cat='hot', cart={}, items={};
['hot','pastry'].forEach(function(k){
  MENU[k].sort(function(a,b){return a.n.localeCompare(b.n);});
  MENU[k].forEach(function(it,i){it.id=k+'-'+i;it.src=photo(it,i);items[it.id]=it;});
});

var $=function(id){return document.getElementById(id);};
var money=function(n){return '$'+n.toFixed(2);};
function count(){var t=0;for(var k in cart)t+=cart[k];return t;}
function sum(){var t=0;for(var k in cart)t+=cart[k]*items[k].p;return t;}

function save(){try{localStorage.setItem('mb-cart',JSON.stringify(cart));}catch(e){}}
try{var s=localStorage.getItem('mb-cart');if(s)cart=JSON.parse(s)||{};}catch(e){cart={};}
for(var k in cart){if(!items[k])delete cart[k];}

function renderGrid(){
  var g=$('grid');g.innerHTML='';
  MENU[cat].forEach(function(it){
    var q=cart[it.id]||0;
    var d=document.createElement('div');
    d.className='tile'+(q?' on':'');
    d.innerHTML='<button class="add" data-id="'+it.id+'">'+
      '<img src="'+it.src+'" alt="'+it.n+'">'+
      '<span class="cap"><b>'+it.n+'</b><span>'+money(it.p)+'</span></span></button>'+
      (q?'<span class="qty">'+q+'</span><button class="dec" data-dec="'+it.id+'" aria-label="Remove one '+it.n+'">&minus;</button>':'');
    d.querySelector('.add').setAttribute('aria-label','Add '+it.n+', '+money(it.p)+(q?'. '+q+' in cart':''));
    g.appendChild(d);
  });
  $('grid').setAttribute('aria-labelledby',cat==='hot'?'t-hot':'t-pastry');
}

function renderBar(){
  var n=count();
  $('bar').hidden=!(n&&$('v-menu').hidden===false);
  if(n){$('barlabel').textContent='Checkout';$('barsum').textContent=n+' · '+money(sum());}
}

function renderCheckout(){
  var ul=$('lines');ul.innerHTML='';
  MENU.hot.concat(MENU.pastry).forEach(function(it){
    var q=cart[it.id];if(!q)return;
    var li=document.createElement('li');
    li.innerHTML='<span class="nm">'+it.n+'</span>'+
      '<span class="step"><button data-dec="'+it.id+'" aria-label="One less '+it.n+'">&minus;</button>'+
      '<b>'+q+'</b><button data-inc="'+it.id+'" aria-label="One more '+it.n+'">+</button></span>'+
      '<span class="amt">'+money(q*it.p)+'</span>';
    ul.appendChild(li);
  });
  $('total').textContent=money(sum());
}

function show(v){
  ['v-start','v-menu','v-checkout','v-done'].forEach(function(id){$(id).hidden=(id!==v);});
  $('back').hidden=(v!=='v-checkout');
  if(v==='v-checkout'){
    $('bar').hidden=false;$('barlabel').textContent='Place order';$('barsum').textContent=money(sum());
  }else{renderBar();}
  window.scrollTo(0,0);
}

function bump(id,n){
  cart[id]=(cart[id]||0)+n;
  if(cart[id]<1)delete cart[id];
  save();
  $('live').textContent=count()?count()+' items, '+money(sum()):'Cart empty';
  if($('v-menu').hidden===false){renderGrid();renderBar();return;}
  if($('v-checkout').hidden===false){
    if(!count()){renderGrid();show('v-menu');return;}
    renderCheckout();
    $('barsum').textContent=money(sum());
  }
}

$('begin').onclick=function(){show('v-menu');renderGrid();};
$('home').onclick=function(){show('v-start');};
$('back').onclick=function(){show('v-menu');renderGrid();};
$('again').onclick=function(){cart={};save();show('v-start');};

$('t-hot').onclick=function(){setTab('hot');};
$('t-pastry').onclick=function(){setTab('pastry');};
function setTab(k){
  cat=k;
  $('t-hot').setAttribute('aria-selected',k==='hot');
  $('t-pastry').setAttribute('aria-selected',k==='pastry');
  renderGrid();
}

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-id]'),d=e.target.closest('[data-dec]'),i=e.target.closest('[data-inc]');
  if(d){bump(d.getAttribute('data-dec'),-1);return;}
  if(i){bump(i.getAttribute('data-inc'),1);return;}
  if(a){bump(a.getAttribute('data-id'),1);}
});

$('barbtn').onclick=function(){
  if($('v-checkout').hidden===false){
    $('orderno').textContent='#'+(Math.floor(Math.random()*899)+100);
    cart={};save();show('v-done');
  }else{renderCheckout();show('v-checkout');}
};

renderBar();
</script>
